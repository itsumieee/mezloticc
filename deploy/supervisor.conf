[program:roblox-checker-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/roblox-account-checker/artisan queue:work redis --sleep=3 --tries=2 --timeout=300 --backoff=10 --max-time=3600
directory=/var/www/roblox-account-checker
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/roblox-account-checker/storage/logs/worker.log
stopwaitsecs=360